tosca_definitions_version: tosca_simple_yaml_1_3
metadata:
  template_name: "Cloud-Native Profile"
  template_author: "Anonymous"
  template_version: "0.1-SNAPSHOT"
description: Cloud-native profile

data_types:
  cloud_native.datatypes.AbstractComponentScalability:
    description: Defines horizontal scaling boundaries for a component.
    properties:
      min_instances:
        type: integer
        required: true
        default: 1
        constraints:
          - greater_or_equal: 0

      max_instances:
        type: integer
        required: true
        default: 1
        constraints:
          - greater_or_equal: 0
        validation:
          $greater_or_equal:
            - $value
            - $get_property: [ SELF, scalability, min_instances ]

      default_instances:
        type: integer
        required: false
        constraints:
          - greater_or_equal: 0
        validation:
          $and:
            - $greater_or_equal:
                - $value
                - $get_property: [ SELF, scalability, min_instances ]
            - $less_or_equal:
                - $value
                - $get_property: [ SELF, scalability, max_instances ]
      # Adicionando "HINTS" para o orquestrador
      target_cpu_utilization:
        type: integer
        required: false
        description: "Métrica alvo para gatilho de escala (ex: 70 para 70%)."
        constraints:
          - in_range: [ 1, 100 ]
      target_mem_utilization:
        type: integer
        required: false
        description: "Métrica alvo de memória para gatilho de escala."
  cloud_native.datatypes.EndpointDetails:
    properties:
      host: { type: string }
      port: { type: integer }
      protocol: { type: string, default: "tcp" }
      role: { type: string, constraints: [primary, replica, internal, public] }
  cloud_native.datatypes.ConfigResource:
    properties:
      file_path: { type: string, description: "Caminho onde o arquivo será montado no container" }
      content: { type: string, description: "Conteúdo bruto do arquivo" }
      read_only: { type: boolean, default: true }

  cloud_native.datatypes.AbstractComponentUpdateStrategy:
    description: Strategy for updating components without downtime.
    properties:
      type:
        type: string
        description: Name of the strategy.
        required: true
        constraints:
          - valid_values: [ rolling_update, recreate, blue_green, canary ]
        default: rolling_update
      
      max_surge:
        type: string # String para permitir "1" ou "25%"
        description: Maximum number or percentage of instances that can be created above the desired cost.
        required: false
        default: "25%"
      
      max_unavailable:
        type: string
        description: Maximum number or percentage of instances that can be unavailable during the update.
        required: false
        default: "25%"

  cloud_native.datatypes.PortMapping:
    properties:
      name:
        type: string
        required: false # ex: "http", "metrics"
      port:
        type: integer
        description: The port exposed by the service (the entry point).
        required: true
      target_port:
        type: integer
        description: The port the component is actually listening on.
        required: false # Se nulo, assume-se igual ao 'port'
  cloud_native.datatypes.LoadBalancerConfig:
    properties:
      static_ip:
        type: string
        required: false
      internal_only:
        type: boolean
        default: false
        description: "If true, the cloud provider will create a private Load Balancer."
      annotations:
        type: map
        entry_schema: { type: string }
        required: false
        description: "Provider-specific settings (e.g. service.beta.kubernetes.io/aws-load-balancer-type)."

  cloud_native.datatypes.IngressRule:
    properties:
      host:
        type: string
        description: "Ex: api.meuprojeto.com"
        required: true
      paths:
        type: list
        entry_schema:
          type: cloud_native.datatypes.HttpPathRule
        required: true

  cloud_native.datatypes.HttpPathRule:
    properties:
      path:
        type: string
        description: "Ex: /v1/users"
        default: "/"
      path_type:
        type: string
        constraints:
          - valid_values: [ Prefix, Exact, ImplementationSpecific ]
        default: Prefix

  cloud_native.datatypes.FinOpsTags:
    description: Mandatory and optional tags for financial operations and governance.
    properties:
      application:
        type: string
        required: true
      environment:
        type: string
        required: true
        constraints:
          - valid_values: [ dev, staging, prod, sandbox ]
      project:
        type: string
        required: false
      owner:
        type: string
        required: false
        description: "Email or ID of the person accountable."
      team:
        type: string
        required: true
      organizational_unit:
        type: string
        required: false
      cost_center:
        type: string
        required: true
        # Exemplo de validação: deve começar com CC- seguido de números
        # constraints:
        #   - pattern: '^CC-[0-9]+$' 
      managed_via:
        type: string
        required: true
        default: manual
        constraints:
          - valid_values: [ manual, terraform, helm, tosca, crossplane ]
      compliance:
        type: list
        entry_schema:
          type: string
        required: false
        description: "List of compliance standards (e.g., [HIPAA, GDPR])."

node_types:
  cloud_native.nodes.AbstractComponent:
    description: An abstract element of the cloud-native application.
    derived_from: tosca.nodes.SoftwareComponent
    properties:
      scalability:
        type: cloud_native.datatypes.AbstractComponentScalability
        required: false
      finops:
        type: cloud_native.datatypes.FinOpsTags
        required: true
      update_strategy:
        type: cloud_native.datatypes.AbstractComponentUpdateStrategy
        required: false
      workload_type:
        type: string
        default: stateless
        constraints:
          - valid_values: [ stateless, stateful ]
        description: >
          'stateless' maps to a Deployment (anonymous pods). 
          'stateful' maps to a StatefulSet (ordered, stable identity).
      env_vars:
        type: map
        entry_schema: { type: string }
        description: "Variáveis de ambiente (serão convertidas em Secrets)."
    
      config_files:
        type: map
        entry_schema: 
          type: cloud_native.datatypes.ConfigResource
        description: "Mapeamento de nome de arquivo para seu conteúdo e destino."

    requirements:
      - host:
          description: Infrastructure needed to deploy the component
          capability: tosca.capabilities.Compute
          # count_range: [1, 1]
          occurrences: [0, 1]
          node: cloud_native.nodes.AbstractWorkspace
      - endpoint_link:
          description: Allows the definition of links between Components
          capability: tosca.capabilities.Endpoint
          relationship: tosca.relationships.ConnectsTo
          node: cloud_native.nodes.AbstractComponent
          # count_range: [0, UNBOUNDED]
          occurrences: [0, UNBOUNDED]
      - storage:
          description: Storage used by the component to persist data
          capability: tosca.capabilities.Storage
          relationship: cloud_native.relationships.PersistsOn
          # count_range: [0, UNBOUNDED]
          occurrences: [0, UNBOUNDED]
    capabilities:
      service_endpoint:
        description: A layer 4 endpoint provided by the component.
        type: tosca.capabilities.Endpoint
        occurrences: [0, UNBOUNDED]
      stable_identity:
        type: cloud_native.capabilities.StatefulIdentity
        occurrences: [0, 1] # Se estiver presente, vira StatefulSet

  cloud_native.nodes.Service:
    description: A cloud-native service.
    derived_from: cloud_native.nodes.AbstractComponent
  cloud_native.nodes.BackingService:
    description: A cloud-native backing service like a log aggregator or a business process engine.
    derived_from: cloud_native.nodes.AbstractComponent
  cloud_native.nodes.StorageBackingService:
    description: A cloud-native storage backing service like a SQL database, eg. PostgresSQL, a NoSQL database, eg. Cassandra, or any other type of storage backing service.
    derived_from: cloud_native.nodes.AbstractComponent
    attributes:
      endpoints:
        type: map
        entry_schema:
          type: cloud_native.datatypes.EndpointDetails
    
  cloud_native.nodes.GenericComponent:
    description: Represents a component that can not be mapped to any other service kind.
    derived_from: cloud_native.nodes.AbstractComponent
  cloud_native.nodes.AbstractInfrastructure:
    description: An abstract element of the infrastructure.
    derived_from: tosca.nodes.Compute
    capabilities:
      host:
        type: tosca.capabilities.Compute
        valid_source_types: [cloud_native.nodes.AbstractComponent]
  # Especialização por Vendor
  cloud_native.nodes.aws.EKSCluster:
    derived_from: cloud_native.nodes.Kubernetes.KubernetesCluster
    properties:
      role_arn: { type: string }
      public_access: { type: boolean, default: false }
      encryption_key: { type: string, required: false }

  cloud_native.nodes.gcp.GKECluster:
    derived_from: cloud_native.nodes.Kubernetes.KubernetesCluster
    properties:
      project_id: { type: string }
      enable_autopilot: { type: boolean, default: true }

  cloud_native.nodes.AbstractContainerOrchestratorCluster:
    description: A cluster managed by a Container Orchestrator like Kubernetes or Nomad.
    derived_from: cloud_native.nodes.AbstractInfrastructure
    properties:
      distribution:
        type: string
        required: true
      distribution_version:
        type: version
        required: true

    capabilities:
      host:
        valid_source_types: [cloud_native.nodes.AbstractComponent]
      manage_nodes:
        type: cloud_native.capabilities.Cluster.Management
      define_Storages:
        type: cloud_native.capabilities.Cluster.StorageDefinition

  cloud_native.nodes.AbstractContainerOrchestratorClusterNode:
    derived_from: cloud_native.nodes.AbstractInfrastructure
    description: A cluster node managed by a Container Orchestrator like Kubernetes or Nomad.
    properties:
      node_role:
        type: string
        default: worker
        constraints:
          - valid_values: [ worker, ingress, storage, master ]
    requirements:
      - cluster:
          description: Cluster that the node is joined
          capability: cloud_native.capabilities.Cluster.Management
          relationship: cloud_native.relationships.ManagedBy
          node: cloud_native.nodes.AbstractContainerOrchestratorCluster

  cloud_native.nodes.AbstractNetworkService:
    description: >
      An abstract node that defines how a component is exposed to the network.
      It maps incoming traffic to the component's internal ports.
    derived_from: tosca.nodes.Root
    properties:
      port_mappings:
        type: list
        description: List of port mappings (Service port -> Target port).
        entry_schema:
          type: cloud_native.datatypes.PortMapping
        required: true
      
      exposure_type:
        type: string
        description: Defines the scope of the service.
        required: true
        default: internal
        constraints:
          - valid_values: [ internal, node, external, headless ]

      protocol:
        type: string
        default: TCP
        constraints:
          - valid_values: [ TCP, UDP, SCTP, HTTP, GRPC ]
      load_balancer_config:
        type: cloud_native.datatypes.LoadBalancerConfig
        required: false

    requirements:
      - backend:
          description: The component that this service exposes.
          capability: tosca.capabilities.Endpoint
          node: cloud_native.nodes.AbstractComponent
          relationship: tosca.relationships.ConnectsTo
          occurrences: [1, 1]

  cloud_native.nodes.AbstractNetworkIngress:
    description: >
      Defines external access rules to services based on HTTP hosts and paths.
    derived_from: tosca.nodes.Root
    properties:
      rules:
        type: list
        entry_schema:
          type: cloud_native.datatypes.IngressRule
        required: true
      tls_enabled:
        type: boolean
        default: false
    requirements:
      # O Ingress "usa" um ou mais NetworkServices
      - backends:
          capability: tosca.capabilities.Endpoint
          node: cloud_native.nodes.AbstractNetworkService
          relationship: tosca.relationships.RoutesTo # Novo relacionamento
          occurrences: [1, UNBOUNDED]
      - certificate:
          capability: tosca.capabilities.Root 
          node: cloud_native.nodes.AbstractCertificate # Aceita qualquer herdeiro
          relationship: tosca.relationships.DependsOn
          occurrences: [0, 1]

  cloud_native.nodes.AbstractWorkspace:
    description: A logical isolation unit within a cluster (Namespace, Project, etc).
    derived_from: tosca.nodes.Root
    properties:
      workspace_name:
        type: string
        required: true
      resource_quota:
        type: map # Ex: { cpu: "4", memory: "8Gi" }
        required: false
    requirements:
      - cluster:
          capability: tosca.capabilities.Compute
          node: cloud_native.nodes.AbstractContainerOrchestratorCluster
          relationship: tosca.relationships.HostedOn
    capabilities:
      # Agora o Workspace passa a ser o "host" para os componentes
      host:
        type: tosca.capabilities.Compute
        valid_source_types: [ cloud_native.nodes.AbstractComponent ]

  cloud_native.nodes.AbstractCertificate:
    derived_from: tosca.nodes.Root
    properties:
      common_name:
        type: string
        required: true
        description: "O domínio principal (ex: api.empresa.com)"
      alt_names:
        type: list
        entry_schema: { type: string }
        required: false
        description: "SANs (Subject Alternative Names)"
  
  # Especialização para quem não usa Cluster (Serverless Puro)
  cloud_native.nodes.CloudProjectWorkspace:
    derived_from: cloud_native.nodes.AbstractWorkspace
    properties:
      region:
        type: string
        required: true
      cloud_provider:
        type: string
        constraints: [{ valid_values: [ aws, gcp, azure ] }]
    capabilities:
      host:
        type: tosca.capabilities.Compute
        valid_source_types: [ cloud_native.nodes.AbstractComponent ]

        
  cloud_native.nodes.AbstractStorage:
    description: Stores data.
    derived_from: tosca.nodes.Abstract.Storage
    capabilities:
      storage:
        type: tosca.capabilities.Storage
        valid_source_types: [cloud_native.nodes.AbstractComponent]  

  cloud_native.nodes.AbstractContainerOrchestratorVolume:
    description: Stores data of components running in a container orchestrator cluster.
    derived_from: cloud_native.nodes.BlockStorage # Herança específica
    requirements:
      - cluster:
          capability: cloud_native.capabilities.Cluster.StorageDefinition
          relationship: cloud_native.relationships.DefinedOn
          node: cloud_native.nodes.AbstractContainerOrchestratorCluster
          occurrences: [ 1, 1 ]

  # Subtipo para Discos/Volumes
  cloud_native.nodes.BlockStorage:
    derived_from: cloud_native.nodes.AbstractStorage
    properties:
      size:
        type: scalar-unit.size
        required: true
    capabilities:
      attachment:
        type: tosca.capabilities.Attachment # Permite o uso de 'AttachesTo'
        valid_source_types: [ cloud_native.nodes.AbstractInfrastructure ]

  # Subtipo para S3/Blob
  cloud_native.nodes.ObjectStorage:
    derived_from: cloud_native.nodes.AbstractStorage
    capabilities:
      endpoint:
        type: tosca.capabilities.Endpoint # Oferece uma URL de acesso
        valid_source_types: [ cloud_native.nodes.AbstractComponent ]

  cloud_native.nodes.aws.ACMCertificate:
    derived_from: cloud_native.nodes.AbstractCertificate
    properties:
      validation_method:
        type: string
        constraints: [{ valid_values: [ DNS, EMAIL ] }]
        default: DNS

  # Kubernetes-specific Node Types

  cloud_native.nodes.Kubernetes.Namespace:
    derived_from: cloud_native.nodes.AbstractWorkspace
    properties:
      annotations:
        type: map
        entry_schema: { type: string }
        required: false
      labels:
        type: map
        entry_schema: { type: string }
        required: false

  
  cloud_native.nodes.Kubernetes.NetworkService:
    description: >
      A Kubernetes-specific service implementation. 
      Maps Abstract requirements to K8s Service manifests.
    derived_from: cloud_native.nodes.AbstractNetworkService
    properties:
      session_affinity:
        type: string
        default: None
        constraints:
          - valid_values: [ None, ClientIP ]
      
      external_traffic_policy:
        type: string
        default: Cluster
        constraints:
          - valid_values: [ Local, Cluster ]
        description: "Controls if traffic is routed to local-node pods or cluster-wide."

      load_balancer_source_ranges:
        type: list
        entry_schema: { type: string }
        required: false
        description: "IP CIDRs allowed to access the LoadBalancer."
        
  cloud_native.nodes.kubernetes.CertManagerCertificate:
    derived_from: cloud_native.nodes.AbstractCertificate
    properties:
      issuer_name:
        type: string
        default: "letsencrypt-prod"
      dns_challenge_provider:
        type: string
        required: false # Para validação automática via DNS
  cloud_native.nodes.kubernetes.NetworkIngress:
    derived_from: cloud_native.nodes.AbstractNetworkIngress
    requirements:
      - certificate:
          # Aqui acontece a restrição:
          node: cloud_native.nodes.kubernetes.CertManagerCertificate 
          occurrences: [0, 1]
  
  cloud_native.nodes.Kubernetes.KubernetesApplication:
    description: A Kubernetes deployable application that implements business features.
    derived_from: cloud_native.nodes.Service
    capabilities:
      declare:
        type: cloud_native.capabilities.Application.ContainerDeclaration

  cloud_native.nodes.Kubernetes.KubernetesDependency:
    description: A Kubernetes deployable application that implements common functionalities used by the Kubernetes Applications.
    derived_from: cloud_native.nodes.BackingService
    capabilities:
      declare:
        type: cloud_native.capabilities.Application.ContainerDeclaration

  cloud_native.nodes.Kubernetes.KubernetesStorageDependency:
    description: A Kubernetes deployable application that implements common functionalities used by the Kubernetes Applications.
    derived_from: cloud_native.nodes.StorageBackingService
    capabilities:
      declare:
        type: cloud_native.capabilities.Application.ContainerDeclaration

  cloud_native.nodes.Kubernetes.KubernetesContainer:
    description: A Kubernetes managed container that is defined in a Kubernetes Application, Kubernetes Dependency or Kubernetes Storage Dependency.
    derived_from: tosca.nodes.Root
    properties:
      image:
        type: string
    requirements:
      - application:
          description: Application that declares the container.
          capability: cloud_native.capabilities.Application.ContainerDeclaration
          relationship: cloud_native.relationships.DeclaredBy
      - storage:
        capability: tosca.capabilities.Attachment
        node: cloud_native.nodes.Kubernetes.AbstractKubernetesVolume
        relationship: cloud_native.relationships.MountsTo
        occurrences: [0, UNBOUNDED]

  cloud_native.nodes.Kubernetes.KubernetesCluster:
    description: Kubernetes cluster managed by a specific distribution (K0s, K3s, RKE2, etc).
    derived_from: cloud_native.nodes.AbstractContainerOrchestratorCluster
    properties:
      # Propriedades específicas de K8s para automação de rede
      pod_cidr:
        type: string
        default: "10.42.0.0/16"
        description: "Network range for pod IPs."
      service_cidr:
        type: string
        default: "10.43.0.0/16"
        description: "Network range for service IPs."
      api_endpoint:
        type: string
        required: false
        description: "The internal or external URL of the Kubernetes API Server."

  cloud_native.nodes.Kubernetes.KubernetesClusterNode:
    description: Physical or virtual machines that joined a Kubernetes cluster.
    derived_from: cloud_native.nodes.AbstractContainerOrchestratorClusterNode
    properties:
      # Labels e Taints são fundamentais para o agendamento de pods
      labels:
        type: map
        entry_schema: { type: string }
        required: false
        description: "Kubernetes node labels (e.g., disktype: ssd)."
      taints:
        type: list
        entry_schema:
          type: string # Exemplo: "key=value:effect"
        required: false
        description: "Kubernetes node taints to repel pods."
    requirements:
      - cluster:
          node: cloud_native.nodes.Kubernetes.KubernetesCluster
          relationship: cloud_native.relationships.ManagedBy
          capability: cloud_native.capabilities.Cluster.Management

  cloud_native.nodes.Kubernetes.AbstractKubernetesVolume:
    description: Any kind of Kubernetes defined volume.
    derived_from: cloud_native.nodes.AbstractContainerOrchestratorVolume

  cloud_native.nodes.Kubernetes.HostPathKubernetesVolume:
    description: A volume that is mapped in the HostPath.
    properties:
      path:
        description: The directory location on host
        type: string
        required: true

      type:
        description: 'Directory type. Can be one of: ‌ "", DirectoryOrCreate, Directory, FileOrCreate, File, Socket, CharDevice, BlockDevice'
        type: string
        required: false
        default: Directory
        constraints:
          - valid_values:
              [
                "",
                DirectoryOrCreate,
                Directory,
                FileOrCreate,
                File,
                Socket,
                CharDevice,
                BlockDevice,
              ]
    derived_from: cloud_native.nodes.Kubernetes.AbstractKubernetesVolume

  cloud_native.nodes.Kubernetes.SecretKubernetesVolume:
    description: A volume that is mapped from a secret.
    derived_from: cloud_native.nodes.Kubernetes.AbstractKubernetesVolume

  cloud_native.nodes.Kubernetes.PersistentVolumeClaimKubernetesVolume:
    description: A volume that is mapped from a persistent volume claim.
    derived_from: cloud_native.nodes.Kubernetes.AbstractKubernetesVolume

  cloud_native.nodes.Kubernetes.LocalKubernetesVolume:
    description: A volume that is a mounted local storage device such as a disk, partition or directory.
    derived_from: cloud_native.nodes.Kubernetes.AbstractKubernetesVolume

  cloud_native.nodes.Kubernetes.ConfigMapKubernetesVolume:
    description: A volume that is a mounted from a config map.
    derived_from: cloud_native.nodes.Kubernetes.AbstractKubernetesVolume

  cloud_native.nodes.Kubernetes.EmptyDirKubernetesVolume:
    description: A volume that is a created when a Kubernetes Pod is assigned to a node, and it is initially empty.
    derived_from: cloud_native.nodes.Kubernetes.AbstractKubernetesVolume   

capability_types:
  cloud_native.capabilities.Cluster.Management:
    derived_from: tosca.capabilities.Root
  cloud_native.capabilities.Cluster.StorageDefinition:
    derived_from: tosca.capabilities.Root
    description: Indicates that the node can act as a management plane for storage resources.
  cloud_native.capabilities.Application.ContainerDeclaration:
    derived_from: tosca.capabilities.Root
relationship_types:
  cloud_native.relationships.PersistsOn:
    description: Relationship used by a component to store persistent data on a storage resource.
    derived_from: tosca.relationships.DependsOn
    valid_target_types: [ tosca.capabilities.Storage ]
    properties:
      mount_path:
        type: string
        required: false
        description: O caminho absoluto dentro do componente onde o storage será montado (ex: /var/lib/mysql).
      access_mode:
        type: string
        default: ReadWriteOnce
        constraints:
          - valid_values: [ ReadWriteOnce, ReadOnlyMany, ReadWriteMany ]
        description: Define como o componente acessa o volume (padrão do Kubernetes/CSI).
  cloud_native.relationships.ManagedBy:
    derived_from: tosca.relationships.Root
    valid_target_types: [cloud_native.capabilities.Cluster.Management]

  cloud_native.relationships.DefinedOn:
    description: Describes a logical association where a resource definition is managed by a specific cluster control plane.
    derived_from: tosca.relationships.DependsOn # Garante que o Cluster venha antes do Volume
    valid_target_types: [ cloud_native.capabilities.Cluster.StorageDefinition ]
    properties:
      namespace:
        type: string
        required: false
        description: The logical isolation unit (namespace, project, tenant) within the cluster.
        default: default
      context_name:
        type: string
        required: false
        description: Optional label for the orchestration context (e.g., storage-class name).
        
  cloud_native.relationships.DeclaredBy:
    description: Defines in which application the container is defined on.
    derived_from: tosca.relationships.Root
    valid_target_types: [cloud_native.capabilities.Application.ContainerDeclaration]
  cloud_native.relationships.MountsTo:
    derived_from: tosca.relationships.ConnectsTo
    properties:
      mount_path:
        type: string
        required: true
        description: "O caminho dentro do container (ex: /var/lib/mysql)"
      read_only:
        type: boolean
        default: false
  cloud_native.relationships.ConnectsTo:
    derived_from: tosca.relationships.ConnectsTo
    properties:
      credential_mapping:
        type: map
        entry_schema: { type: string }
        description: "Mapeia atributos do alvo para env vars da origem. Ex: { 'DB_URL': 'host' }"
        required: false
